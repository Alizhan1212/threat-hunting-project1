title: PowerShell Spawned by Microsoft Office Application
id: 8c2d4f6e-1a3b-4c5d-9e7f-2b4c6d8e0a19
status: experimental
description: |
    Detects powershell.exe started by Word, Excel, Outlook or PowerPoint. Typical for
    phishing attachments (e.g. "Kazpost parcel notification" .docm with a macro).
    Produced by hunt H3 (week 5). Deliberately keyed on the PARENT process, not on
    "-EncodedCommand": in our data 30 of 31 encoded PowerShell runs were a legitimate IT agent.
author: Kazhymukan Boris (threat-hunting-project1 group)
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/001/
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\OUTLOOK.EXE'
            - '\POWERPNT.EXE'
    selection_child:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Rare legitimate Office add-ins that call PowerShell - verify and allow-list by command line
level: high
tags:
    - attack.initial_access
    - attack.t1566.001
    - attack.execution
    - attack.t1204.002
    - attack.t1059.001
